<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Exercício 2 - Acessibilidade (a11y)</title>
    <style>
        body { padding: 40px; }
        .conteudo-acessivel {
            background-color: #ffffff;
            border-left: 5px solid #000;
            padding: 20px;
            max-width: 500px;
        }

        .texto-legivel {
            color: #222222; 
            font-size: 1.1rem; 
            line-height: 1.6; 
        }
    </style>
</head>
<body>
    <div class="conteudo-acessivel">
        <h1>Princípio de Acessibilidade</h1>
        <p class="texto-legivel">
            Garantir que pessoas com deficiência visual possam usar a interface 
            é fundamental para o desenvolvedor Frontend. 
            Aqui o contraste é alto e a fonte é fácil de ler.
        </p>
    </div>
</body>
</html>
