<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Exercício 1 - Hierarquia e Espaçamento</title>
    <style>
        body { font-family: sans-serif; background: #f0f0f0; padding: 40px; }
        .card-produto {
            background: white;
            max-width: 300px;
            padding: 24px; 
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .categoria { font-size: 0.7rem; color: #888; text-transform: uppercase; }
        .titulo { font-size: 1.5rem; margin: 0; font-weight: bold; } /* Peso de fonte  */
        .preco { font-size: 1.2rem; color: #333; }
    </style>
</head>
<body>
    <div class="card-produto">
        <span class="categoria">Novidades Shein</span>
        <h2 class="titulo">Vestido Midi Elegante</h2>
        <p class="preco">R$ 129,90</p>
    </div>
</body>
</html>
