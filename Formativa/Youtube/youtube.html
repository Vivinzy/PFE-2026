<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vitube</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="youtube.css">
</head>
<body>

<nav class="navbar">
  <div class="nav-left">
    <button class="menu-toggle" id="menuToggle">☰</button>
    <div class="logo" id="logoBtn">
      <span class="logo-icon">▶</span>
      <span>Vi<strong>tube</strong></span>
    </div>
  </div>
  <div class="nav-search">
    <input type="text" placeholder="Pesquisar..." class="search-input">
    <button class="search-btn">🔍</button>
  </div>
  <div class="nav-right">
    <button class="icon-btn">📹</button>
    <button class="icon-btn">🔔</button>
    <div class="avatar">V</div>
  </div>
</nav>

<aside class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <button class="close-sidebar" id="closeSidebar">✕</button>
    <span>Menu</span>
  </div>
  <div class="sidebar-content">
    <a href="#" class="sidebar-item active" data-section="home">
      <img src="/Formativa/Youtube/fotos/casa.png" class="icon">
      <span>Início</span>
    </a>
    <a href="#" class="sidebar-item" data-section="trending">
      <img src="/Formativa/Youtube/fotos/fogo.png" class="icon">
      <span>Em Alta</span>
    </a>
    <a href="#" class="sidebar-item" data-section="subscriptions">
      <img src="/Formativa/Youtube/fotos/inscrição.png" class="icon">
      <span>Inscrições</span>
    </a>
    <hr class="sidebar-divider">
    <a href="#" class="sidebar-item" data-section="library">
     <img src="/Formativa/Youtube/fotos/biblioteca.png" class="icon">
      <span>Sua biblioteca</span>
    </a>
    <a href="#" class="sidebar-item" data-section="history">
      <img src="/Formativa/Youtube/fotos/historia.png" class="icon">
      <span>Histórico</span>
    </a>
    <a href="#" class="sidebar-item" data-section="watch-later">
    <img src="/Formativa/Youtube/fotos/passado.png" class="icon">
      <span>Assistir mais tarde</span>
    </a>
    <a href="#" class="sidebar-item" data-section="liked">
      <img src="/Formativa/Youtube/fotos/gostar.png" class="icon">
      <span>Vídeos com gosto</span>
    </a>
    <hr class="sidebar-divider">
    <div class="sidebar-section-title">Canais</div>
    <a href="#" class="sidebar-item">
      <img src="/Formativa/Youtube/fotos/do-utilizador.png" class="icon">
      <span>Meu Canal</span>
    </a>
    <hr class="sidebar-divider">
    <a href="#" class="sidebar-item" data-section="settings">
      <img src="/Formativa/Youtube/fotos/definicoes.png" class="icon">
      <span>Configurações</span>
    </a>
    <a href="#" class="sidebar-item" data-section="help">
      <img src="/Formativa/Youtube/fotos/ajudando.png" class="icon">
      <span>Ajuda</span>
    </a>
  </div>
</aside>

<div class="sidebar-overlay" id="sidebarOverlay"></div>

<main class="main-content" id="mainContent">

  <!-- HOME PAGE -->
  <div id="homePage">
    <p class="section-title">// vídeos</p>
    <div class="video-grid" id="videoGrid"></div>
  </div>

  <!-- WATCH PAGE -->
  <div id="watchPage" class="hidden">
    <button class="back-btn" id="backBtn">← Voltar</button>
    <div class="watch-layout">
      <div class="watch-main">
        <div class="video-player-wrap">
          <iframe id="playerIframe" allowfullscreen allow="autoplay; encrypted-media"></iframe>
        </div>
        <div class="video-info">
          <h1 class="watch-title" id="watchTitle"></h1>
          <div class="watch-meta">
            <span id="watchViews"></span>
            <span id="watchDate"></span>
          </div>
          <div class="watch-actions">
            <button class="action-btn" id="likeBtn">👍 <span id="likeCount"></span></button>
            <button class="action-btn" id="dislikeBtn">👎</button>
            <button class="action-btn">🔗 Compartilhar</button>
            <button class="action-btn">💾 Salvar</button>
          </div>
          <div class="channel-bar">
            <div class="channel-avatar" id="watchAvatar"></div>
            <div class="channel-info">
              <p class="channel-name" id="watchChannel"></p>
              <p class="channel-subs" id="watchSubs"></p>
            </div>
            <button class="subscribe-btn" id="subscribeBtn">Inscrever-se</button>
          </div>
          <div class="description-box" id="watchDesc"></div>
        </div>

        <div class="comments-section">
          <h3 class="comments-title">Comentários</h3>
          <div class="comment-input-row">
            <div class="avatar small">V</div>
            <input type="text" id="commentInput" placeholder="Adicione um comentário...">
            <button class="send-btn" id="sendComment">Enviar</button>
          </div>
          <div id="commentsList"></div>
        </div>
      </div>

      <aside class="watch-sidebar">
        <p class="rec-label">// a seguir</p>
        <div id="recommendations"></div>
      </aside>
    </div>
  </div>

</main>

<script src="youtube.js"></script>
</body>
</html>
